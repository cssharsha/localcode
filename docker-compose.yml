services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: always
    tty: true
    ports:
      - "11336:11434"
    volumes:
      - /data/ollama-models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  claude-router:
    build: .
    container_name: claude-router
    restart: always
    ports:
      - "3000:3456"
    volumes:
      - ./router-config.json:/root/.claude-code-router/config.json
    depends_on:
      - ollama
